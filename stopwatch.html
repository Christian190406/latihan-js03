<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Javascript 03 - Stopwatch</title>
</head>
<body>

    <h1>Latihan Javascript 03</h1>

    <h3 id="waktu">0</h3>

    <button onclick="mulai()">Start</button>
    <button onclick="berhenti()">Stop</button>
    <button onclick="reset()">Reset</button>

    <script>
        // Variabel untuk menyimpan waktu
        let detik = 0;

        // Variabel untuk menyimpan interval
        let timer = null;

        // Fungsi Start
        function mulai() {

            // Mencegah timer berjalan berkali-kali
            if (timer === null) {

                timer = setInterval(function() {

                    detik++;

                    document.getElementById("waktu").textContent = detik;

                }, 1000);
            }
        }

        // Fungsi Stop
        function berhenti() {

            clearInterval(timer);

            timer = null;
        }

        // Fungsi Reset
        function reset() {

            clearInterval(timer);

            timer = null;

            detik = 0;

            document.getElementById("waktu").textContent = detik;
        }
    </script>

</body>
</html>
